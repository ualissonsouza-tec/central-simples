<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central Simples - Redefinir senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       REDEFINICAO DE SENHA - CSS LOCAL
       1. Card central
       2. Campos e botoes
       3. Alertas de sucesso/erro
       ========================================================================== */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0d1b2a;
      --navy-2: #142338;
      --navy-3: #1a2f4a;
      --blue: #2563eb;
      --blue-lt: #3b82f6;
      --sky: #7dd3fc;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --error: #fca5a5;
      --success: #86efac;
      --radius: 10px;
    }

    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(37,99,235,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,.07) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      top: -140px;
      left: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(20,35,56,.96);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      padding: 2rem;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .logo-3d {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: url('/icon.svg') center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,.35), inset 0 2px 6px rgba(255,255,255,.18);
    }

    .eye {
      display: none;
    }

    .eye::after { content: none; }

    .brand-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.45rem;
      color: #fff;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.7rem;
      color: #fff;
      margin-bottom: .45rem;
    }

    p {
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.55;
      margin-bottom: 1.35rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: .74rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: .45rem;
    }

    input {
      width: 100%;
      background: var(--navy-3);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      padding: 12px 14px;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--blue-lt);
      box-shadow: 0 0 0 3px rgba(59,130,246,.18);
    }

    .alert {
      display: none;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: .84rem;
      margin-bottom: 1rem;
      line-height: 1.45;
    }

    .alert.show { display: block; }
    .alert.error { background: rgba(220,38,38,.12); border: 1px solid rgba(220,38,38,.3); color: var(--error); }
    .alert.success { background: rgba(134,239,172,.1); border: 1px solid rgba(134,239,172,.3); color: var(--success); }

    .btn {
      width: 100%;
      border: none;
      border-radius: var(--radius);
      padding: 13px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) { background: #1d4ed8; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .back {
      display: block;
      margin-top: 1rem;
      text-align: center;
      color: var(--sky);
      font-size: .86rem;
      text-decoration: none;
    }

    .spin {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 560px) {
      .card {
        padding: 1.5rem 1rem;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- =========================================================================
       REDEFINICAO DE SENHA - HTML
       1. Formulario de nova senha
       2. Alertas de feedback
       ========================================================================= -->
  <main class="card">
    <div class="brand">
      <div class="logo-3d"><div class="eye"></div></div>
      <div class="brand-name">Central Simples</div>
    </div>

    <h1>Criar nova senha</h1>
    <p>Digite sua nova senha. O link de recuperação expira em 1 hora e só pode ser usado uma vez.</p>

    <div class="alert error" id="erro"></div>
    <div class="alert success" id="ok"></div>

    <form id="form-reset">
      <div class="field">
        <label for="senha">Nova senha</label>
        <input id="senha" type="password" autocomplete="new-password" minlength="8" required />
      </div>

      <div class="field">
        <label for="confirmar">Confirmar senha</label>
        <input id="confirmar" type="password" autocomplete="new-password" minlength="8" required />
      </div>

      <button class="btn" id="btn-reset" type="submit">
        <span class="spin" id="spin"></span>
        <span id="btn-text">Redefinir senha</span>
      </button>
    </form>

    <a class="back" href="/login.html">Voltar para o login</a>
  </main>

  <script>
    // =========================================================================
    // REDEFINICAO DE SENHA - JS
    // 1. Leitura do token
    // 2. Validacao da nova senha
    // 3. Envio para o backend
    // =========================================================================

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';

    function show(id, message) {
      const el = document.getElementById(id);
      el.textContent = message;
      el.classList.add('show');
    }

    function hideAlerts() {
      ['erro', 'ok'].forEach((id) => {
        const el = document.getElementById(id);
        el.textContent = '';
        el.classList.remove('show');
      });
    }

    function setLoading(active) {
      document.getElementById('btn-reset').disabled = active;
      document.getElementById('spin').style.display = active ? 'block' : 'none';
      document.getElementById('btn-text').textContent = active ? 'Aguarde...' : 'Redefinir senha';
    }

    if (!token) {
      show('erro', 'Link de recuperação inválido. Solicite uma nova recuperação no login.');
      document.getElementById('btn-reset').disabled = true;
    }

    document.getElementById('form-reset').addEventListener('submit', async (event) => {
      event.preventDefault();
      hideAlerts();

      const password = document.getElementById('senha').value;
      const confirmation = document.getElementById('confirmar').value;

      if (password.length < 8) {
        show('erro', 'A senha deve ter pelo menos 8 caracteres.');
        return;
      }
      if (password !== confirmation) {
        show('erro', 'As senhas não conferem.');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();

        if (data.success) {
          show('ok', data.message || 'Senha redefinida com sucesso.');
          document.getElementById('form-reset').reset();
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1800);
        } else {
          show('erro', data.message || 'Não foi possível redefinir a senha.');
        }
      } catch {
        show('erro', 'Erro de conexao. Verifique se o servidor esta rodando.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
